<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOAMU 인증 결과 목업</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #eae6df; color: #493725; font: 14px/1.6 system-ui, sans-serif; }
    .preview-layout { display: flex; justify-content: center; align-items: flex-start; gap: 32px; }
    aside { width: 280px; padding: 24px; background: #fff8ec; border: 1px solid #dcc8ab; border-radius: 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    label { display: block; margin-top: 20px; font-weight: 600; }
    select, button { padding: 10px; width: 100%; margin-top: 8px; border: 1px solid #dcc8ab; border-radius: 8px; background: white; color: inherit; font: inherit; }
    button { cursor: pointer; }
    .notice { font-size: 12px; color: #746451; }
    .device { width: 390px; flex-shrink: 0; }
    iframe { display: block; border: 3px solid #6b5138; border-radius: 24px; width: 100%; height: 820px; background: #fff8ec; }
    .caption { text-align: center; font-size: 12px; }
    @media(max-width: 760px) { body { padding: 12px; } .preview-layout { flex-direction: column; align-items: center; gap: 16px; } aside { width: 100%; max-width: 430px; padding: 16px; } .device { max-width: 100%; } }
  </style>
</head>
<body>
  <div class="preview-layout">
    <aside>
      <h1>인증 결과 미리보기</h1>
      <p>로그인 없이 실제 화면 컴포넌트를 확인하세요.</p>
      <p class="notice">로컬 개발 전용 · 샘플 데이터<br />실제 API·DB·S3·AI 호출 없음</p>
      <label for="scenario">화면 선택</label>
      <select id="scenario">
        <option value="success">성공 · 3 / 14 조각</option>
        <option value="failed">실패 · 남은 시도 2 / 3</option>
        <option value="exhausted">실패 · 시도 소진</option>
        <option value="review">검토 대기</option>
        <option value="error">결과 조회 오류 → 재조회 성공</option>
        <option value="no-image">성공 · 작품 이미지 없음</option>
        <option value="seven">성공 · 7회차 / 3×3 격자</option>
      </select>
      <label for="width">화면 너비</label>
      <select id="width">
        <option value="320">320px</option>
        <option value="390" selected>390px</option>
        <option value="430">430px</option>
      </select>
      <button id="reset" type="button">선택한 화면 초기화</button>
      <p class="notice">‘다시 인증하기’에서 사진을 선택하고 제출하면 샘플 성공 결과로 이동합니다. 사진은 서버에 업로드되지 않습니다.</p>
      <p class="notice">퍼즐 작품은 미리보기용 샘플입니다. 홈·미술관·도전 목록 버튼은 이동 경로 확인 화면을 보여줍니다.</p>
    </aside>
    <section class="device" id="device" aria-label="모바일 화면">
      <iframe id="preview" title="MOAMU 인증 결과 화면"></iframe>
      <p class="caption">실제 컴포넌트 · 곡선 퍼즐 대신 격자 표시</p>
    </section>
  </div>
  <script type="module">
    if (!import.meta.env.DEV || !['localhost', '127.0.0.1'].includes(location.hostname)) {
      throw new Error('목업은 로컬 개발 서버에서만 실행할 수 있습니다.');
    }
    const scenario = document.getElementById('scenario');
    const width = document.getElementById('width');
    const frame = document.getElementById('preview');
    const currentCase = new URL(location.href).searchParams.get('case');
    if ([...scenario.options].some(option => option.value === currentCase)) scenario.value = currentCase;
    function reset() {
      const url = new URL(location.href);
      url.searchParams.set('case', scenario.value);
      history.replaceState(null, '', url);
      frame.src = './verification-result-preview.html?case=' + encodeURIComponent(scenario.value);
    }
    scenario.addEventListener('change', reset);
    document.getElementById('reset').addEventListener('click', reset);
    width.addEventListener('change', () => { document.getElementById('device').style.width = width.value + 'px'; });
    reset();
  </script>
</body>
</html>
