<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOAMU 인증 로컬 모킹 테스트</title>
  </head>
  <body>
    <aside style="position:fixed;right:8px;top:8px;z-index:200;padding:12px;max-width:240px;background:#fff8ed;border:1px solid #6b8664;border-radius:8px;font:13px sans-serif;color:#4b3828">
      <strong>로컬 테스트 · 실제 서버 호출 없음</strong>
      <p><label for="mock-case">판정 결과 선택</label></p>
      <select id="mock-case">
        <option value="success">성공</option>
        <option value="failed">실패</option>
        <option value="review">검토 필요</option>
        <option value="technical">기술 오류 → 재시도 성공</option>
      </select>
      <p>사진 선택 → 인증하기 → 3초 후 결과</p>
      <p id="mock-metrics" role="status"></p>
      <small>결과를 바꾸거나 새로고침하면 초기화됩니다.</small>
    </aside>
    <div id="root"></div>
    <script type="module" src="/src/mockTest/verification-mock.tsx"></script>
  </body>
</html>
