# test Profile: MySQL Testcontainers를 사용하는 테스트 전용 설정을 관리합니다.
# 테스트 DB 연결 정보는 Testcontainers에서 공급하며, 운영 DB를 사용하지 않습니다.
# Spring 컨텍스트 테스트에서 @ActiveProfiles("test")로 명시합니다.
# 팀 개발 DB와 같은 MySQL 8.4.11을 사용함. TEST_MYSQL_IMAGE로 변경 가능함.
test:
  mysql:
    image: ${TEST_MYSQL_IMAGE:mysql:8.4.11}

# 개발용 사진 폴더와 분리된 테스트 전용 임시 저장 경로입니다.
app:
  storage:
    local-root: ${java.io.tmpdir}/moamu-test-uploads
