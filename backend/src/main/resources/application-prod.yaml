# prod Profile: 운영 환경의 MySQL, Redis 연결 및 운영 설정을 관리합니다.
# 연결 정보와 비밀값은 실행 환경에서 주입하고, Swagger UI와 API 문서는 비활성화합니다.
# 실행 환경에 SPRING_PROFILES_ACTIVE=prod를 명시합니다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
