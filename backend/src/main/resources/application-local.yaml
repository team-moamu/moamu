# local Profile: 개발자 PC에서 실행할 때 사용하는 MySQL, Redis 및 Swagger 설정을 관리합니다.
# 연결 정보는 환경변수로 주입하고, 실제 비밀번호나 API Key는 작성하지 않습니다.
# 실행 예: .\gradlew.bat bootRun --args="--spring.profiles.active=local"
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
