# local Profile: 개발자 PC에서 실행할 때 사용하는 MySQL, Redis 및 Swagger 설정을 관리합니다.
# 연결 정보는 환경변수로 주입하고, 실제 비밀번호나 API Key는 작성하지 않습니다.
# 실행 예: .\gradlew.bat bootRun --args="--spring.profiles.active=local"
# DB_URL의 포트는 개인 Docker 포트 매핑에 맞게 설정합니다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      # Redis가 준비되기 전에는 환경 변수를 생략하고 MySQL 연결을 확인합니다.
      # Redis 기능을 사용하려면 실제 서버가 필요합니다.
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# redis 준비 전(준비되면 삭제하거나 true로 바꾸기)
management:
  health:
    redis:
      enabled: false

# 로컬 이미지 파일 저장 경로
app:
  storage:
    local-root: ${MOAMU_STORAGE_ROOT:./data/uploads}