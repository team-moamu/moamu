# 공통 설정: 모든 환경에서 사용하는 기본 설정을 관리합니다.
# 사용할 Profile(local / test / prod)은 실행 시 명시합니다.
spring:
  application:
    name: moamu-backend
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
