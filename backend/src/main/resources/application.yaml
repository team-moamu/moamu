# 공통 설정: 모든 환경에서 사용하는 기본 설정을 관리합니다.
# 사용할 Profile(local / test / prod)은 실행 시 명시합니다.
spring:
  application:
    name: moamu-backend
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  # 이미지 파일 업로드 크기 제한 (공통)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  # AWS S3 설정
  app:
    s3:
      bucket: ${S3_BUCKET:moamu-s3-bucket}
      region: ${AWS_REGION:ap-northeast-2}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
