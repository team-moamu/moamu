# 공통 설정: 모든 환경에서 사용하는 기본 설정을 관리합니다.
# 사용할 Profile(local / test / prod)은 실행 시 명시합니다.
spring:
  application:
    name: moamu-backend
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  # 이미지 파일 업로드 크기 제한 (공통)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      
# S3 설정
app:
  ai:
    server-url: ${AI_SERVER_URL:}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_READ_TIMEOUT:30s}
  storage:
    s3:
      bucket: ${S3_BUCKET}
      region: ${AWS_REGION}
      artwork-prefix: ${S3_ARTWORK_PREFIX}
      profile-prefix: ${S3_PROFILE_PREFIX}
      verification-prefix: ${S3_VERIFICATION_PREFIX}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
