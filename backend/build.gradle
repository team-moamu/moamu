
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.moamu'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    // HEIC/HEIF 디코더 공식 저장소
    maven {
        url = uri('https://releases.aspose.com/java/repo/')
        content { includeModule('openize', 'openize-heic') }
    }
}

def jjwtVersion = '0.13.0'
def springdocVersion = '2.8.17'

dependencies {
    // 이미지 EXIF 회전 정보 추출
    implementation 'com.drewnoakes:metadata-extractor:2.20.0'
    // HEIC 정지 이미지 디코딩
    implementation 'openize:openize-heic:26.5'
    // ImageIO WebP 디코딩 및 리사이징 후 원래 형식으로 인코딩
    runtimeOnly 'com.github.usefulness:webp-imageio:0.11.0'

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // QueryDSL (Jakarta, versions managed by Spring Boot BOM)
    implementation 'com.querydsl:querydsl-jpa::jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt::jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    // Database migration
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    // OpenAPI / Swagger UI
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // AWS S3
    implementation 'software.amazon.awssdk:s3:2.57.6'
}

// Keep generated Q classes under build/ so Gradle manages compilation and cleanup.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Aquerydsl.generatedAnnotationClass=jakarta.annotation.Generated']
}

tasks.named('test') {
    useJUnitPlatform()
}
