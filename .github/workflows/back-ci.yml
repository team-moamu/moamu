name: Back build and deploy

on:
  push:
    branches: [develop, master]
    paths:
      - 'backend/**'
      - '.github/workflows/back-ci.yml'

permissions:
  contents: read

concurrency:
  group: back-${{ github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/moamu-back

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Get deployment repository token
        id: deploy-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ vars.DEPLOY_REPO_OWNER }}
          repositories: moamu-deploy

      - name: Check out deployment repository
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.DEPLOY_REPO_OWNER }}/moamu-deploy
          token: ${{ steps.deploy-token.outputs.token }}
          ref: main
          path: moamu-deploy

      - name: Update environment image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "develop" ]; then
            ENVIRONMENT=dev
          elif [ "$BRANCH" = "master" ]; then
            ENVIRONMENT=prod
          else
            exit 1
          fi

          cd "moamu-deploy/environments/$ENVIRONMENT/back"
          kustomize edit set image "moamu-api=${IMAGE}@${DIGEST}"
          kustomize build . >/dev/null

          git add kustomization.yaml
          if git diff --cached --quiet; then
            exit 0
          fi

          git -c user.name=moamu-deploy-bot \
              -c user.email=moamu-deploy-bot@users.noreply.github.com \
              commit -m "Deploy back ${GITHUB_SHA::12} to $ENVIRONMENT"

          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
